name: Agent ID probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["test-fork/agentid-probe.test.js", ".github/workflows/agentid-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe .ai Agent ID registry on a BSC mainnet fork
        env:
          FORK_URL: ${{ secrets.BSC_RPC != '' && secrets.BSC_RPC || 'https://bsc-rpc.publicnode.com' }}
        run: npx hardhat test test-fork/agentid-probe.test.js
